arch: arm64
replicaCount: 1

ingress:
  enabled: true
  hosts:
    - atlas-invoice-analyzer.sa-demo.staging.corp.mongodb.com

services:
  - name: http
    ingress: true
    port: 80
    probes: true
    protocol: TCP
    targetPort: 8080
    type: ClusterIP

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

env:
  PORT: "8080"
  ENVIRONMENT: staging
  APP_BASE_URL: https://atlas-invoice-analyzer.sa-demo.staging.corp.mongodb.com

envSecrets: {}

probes:
  enabled: true
  path: /
  liveness:
    httpGet: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: nitin.mukheja@mongodb.com
